[project]
name = "dossier"
version = "0.1.0"
description = "Document collection and audit pipeline: sync, freeze, convert, audit, score."
requires-python = ">=3.12"
readme = "README.md"

# Every dependency here earns its place. Nothing is added without a reason
# recorded in the commit message (CLAUDE.md, working style).
dependencies = [
    # All schemas and configuration models. Spec 006 R6.7 requires one pydantic
    # model to generate the model-facing schema, the validation and the scorer
    # field list — there is no second definition anywhere.
    "pydantic>=2.7",
    # The CLI surface described in specs 003/004: sync, run --plan, run, eval.
    "typer>=0.12",
    # sources.yaml and pipeline.yaml (spec 003).
    "pyyaml>=6.0",
    # The OpenAI-compatible model client (spec 009, R9.12). Imported only by
    # dossier.infrastructure.models, one of the two packages that may reach the
    # network (R0.9). Its MockTransport answers a request with no socket, which
    # is what lets the default suite test the client offline.
    "httpx>=0.28.1",
    # Jira wiki markup to markdown, for an issue's description and comments
    # (spec 008, R8.17). A dependency of dossier itself rather than an extra,
    # because the Jira connector it serves is not one. Pinned exactly, as
    # Docling is: what it writes is inside the artifact, and K_convert names
    # jira-issue-markdown's version, not this library's (R5.4). Upgrading it is
    # a new version of that converter.
    "jira2markdown==0.5.1",
    # A Confluence page's rendered body as markdown (spec 008, R8.20), for the
    # same reasons: the connector it serves is core, and what these write is
    # inside the artifact under confluence-page-markdown's version. Both are
    # pinned, because BeautifulSoup builds the tree markdownify writes, and a
    # new release of either can change an artifact under an unchanged key.
    "markdownify==1.2.3",
    "beautifulsoup4==4.15.0",
    # robots.txt as RFC 9309 reads it, for the web connector (spec 001, R1.27).
    # The Scrapy project's parser: no dependencies, and it parses text it is
    # handed, so it reaches no network. The standard library's robotparser
    # matches by prefix alone and misreads `Disallow: /*.pdf$`. A floor rather
    # than a pin: nothing it decides enters a snapshot or a key.
    "protego>=0.7,<1",
]

[project.optional-dependencies]
# Run tracking, traces and judge scores (spec 007 R7.9). Heavy, and only the
# infrastructure layer may import it, so it stays out of the default install.
tracking = ["mlflow>=2.14"]
# The PDF converters (spec 008). One pinned wheel does text extraction *and*
# page rendering, so pdf-markdown and pdf-images share a single version-bump
# obligation -- and that obligation is the one promise in this repository no
# test can enforce, so halving the number of places it can be broken is worth
# more than better table extraction. BSD-3/Apache-2.0 with prebuilt wheels and
# no system binary; PyMuPDF was rejected on its AGPL licence, which would reach
# everyone who installs dossier.
# Pillow is not optional despite the name of this extra: `pdf-images` renders
# a page through `to_pil()` and `jpeg-pages` decodes through `Image.open`,
# and pypdfium2 declares no dependencies at all -- so `pip install
# dossier[pdf]` shipped a converter that raised ImportError on its first page.
# It is here rather than in the base install because nothing outside the
# picture converters touches it.
# deflate (MIT; libdeflate, MIT) compresses every PNG part those converters
# write. Pillow's own PNG encoder wrote different bytes for the same pixels on
# Windows (zlib-ng) and Linux (zlib), and so does the standard library's zlib;
# libdeflate's output depends on its input and level alone (R8.29). Pinned
# exactly: a new libdeflate may compress differently, and every converter that
# writes a PNG would have to raise its version with it (R5.4).
pdf = ["pypdfium2>=4.30", "pillow>=10.0", "deflate==0.9.0"]
# docling-markdown: a PDF with no text layer read by OCR (spec 008, R8.14).
# MIT (Docling), Apache-2.0 (RapidOCR), MIT (onnxruntime). docling-slim with only
# what reads a PDF; `docling` itself adds converters for Word, PowerPoint, Excel
# and e-mail that nothing here uses. Pinned exactly, because docling-markdown's
# version names what reads a photocopy -- Docling's layout and table code,
# RapidOCR and the OCR models inside its wheel, and the runtime that executes
# them -- and a newer release of any of them can change an artifact under a key
# claiming nothing did (R8.2). Moving a pin is raising that version.
# Heavy: it brings torch, so CI does not install it and the tests that run it
# are `live`. And docling-core caps typer below 0.27; one lock resolves every
# extra together, so the whole install holds typer at 0.26.
docling = [
    "docling-slim[convert-core,format-pdf,models-local,feat-ocr-rapidocr-onnx]==2.130.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "pypdfium2>=4.30",
]
# A web page built in the browser, drawn by a headless Chromium (spec 001,
# R1.40 - R1.42). Apache-2.0, Microsoft's; three packages, where crawl4ai, built
# on it, is 86 more. The Chromium it drives is a second step, `playwright
# install chromium-headless-shell`, which dossier never runs itself (R1.42).
# Only `dossier.infrastructure.connectors` may import it (R0.10).
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
    "pytest>=8.2",
    "ruff>=0.5",
]
# Mutation testing over domain/ (dev/mutation/README.md): cosmic-ray lists and
# applies the mutants, coverage says which tests run each line. Installed only
# with `--group mutation`; nothing in the default suite or in dossier needs it.
mutation = [
    "cosmic-ray>=8.7",
    "coverage>=7.6",
]

[project.scripts]
dossier = "dossier.cli.main:app"

# MLflow asks request auth providers for a credential on every request, and
# loads them from this entry point at its own import (R10.17).
[project.entry-points."mlflow.request_auth_provider"]
dossier = "dossier.infrastructure.tracking.auth:DossierAuthProvider"

# A new source type is a package that declares an entry point in this group.
# It is never added to a match statement inside dossier (spec 001 R1.7).
[project.entry-points."dossier.connectors"]
folder = "dossier.infrastructure.connectors.folder:FolderConnector.from_config"
jira = "dossier.infrastructure.connectors.jira:JiraConnector.from_config"
confluence = "dossier.infrastructure.connectors.confluence:ConfluenceConnector.from_config"
web = "dossier.infrastructure.connectors.web:WebConnector.from_config"

# A converter is a package declaring one of these (R8.7). The one shipped here
# registers through the same group a third party would use, with no special case.
[project.entry-points."dossier.converters"]
docling-markdown = "dossier.infrastructure.converters.docling_markdown:DoclingMarkdownConverter"
html-markdown = "dossier.infrastructure.converters.html_markdown:HtmlMarkdownConverter"
confluence-page-markdown = "dossier.infrastructure.converters.confluence_page_markdown:ConfluencePageMarkdownConverter"
jira-issue-markdown = "dossier.infrastructure.converters.jira_issue_markdown:JiraIssueMarkdownConverter"
image-jpeg-pages = "dossier.infrastructure.converters.image_pages:JpegPagesConverter"
image-png-pages = "dossier.infrastructure.converters.image_pages:PngPagesConverter"
markdown-text = "dossier.infrastructure.converters.markdown_text:MarkdownTextConverter"
pdf-images = "dossier.infrastructure.converters.pdf_images:PdfImagesConverter"
pdf-markdown = "dossier.infrastructure.converters.pdf_markdown:PdfMarkdownConverter"
text-plain = "dossier.infrastructure.converters.text_plain:TextPlainConverter"
text-csv = "dossier.infrastructure.converters.text_csv:TextCsvConverter"

# A model provider is a package declaring one of these (spec 009, R9.1). The
# prefix of a `model:` value before its first `:` names one. Registered here so
# a pipeline naming them loads, and each states its default endpoint (R9.2).
[project.entry-points."dossier.models"]
anthropic = "dossier.infrastructure.models.anthropic:anthropic"
gemini = "dossier.infrastructure.models.openai_compatible:gemini"
hf = "dossier.infrastructure.models.openai_compatible:hf"
ollama = "dossier.infrastructure.models.ollama:ollama"
openai = "dossier.infrastructure.models.openai_compatible:openai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # The one acceptance test currently driving the outer loop. Red on purpose,
    # excluded from the default run, and tests/architecture asserts that at most
    # one exists at a time. See CLAUDE.md, "The two loops".
    "outer_loop: the open outer-loop acceptance test; red until its slice lands",
    # The only place a real model call is permitted, for `evaluated` rules that
    # cannot be checked any other way. Never part of the default suite.
    "live: needs a real model or a real service; excluded from the default run",
]
# The default suite is what a contributor and CI run: offline, in seconds, at
# zero cost. Both exclusions are deliberate and both are visible here.
addopts = "-m 'not outer_loop and not live' --strict-markers -q"

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]
# Fixture-generation support code, excluded rather than fixed. Its import order
# is load-bearing: _common.py sets SOURCE_DATE_EPOCH and reportlab's `invariant`
# flag before the reportlab imports that read them, which is what makes the
# committed PDFs byte-stable. Sorting those imports (I001) or hoisting them to
# the top (E402) would silently break regeneration -- the determinism R0.4 and
# R5.6 are about. The modules ship no code and are never imported by dossier.
#
# `*.md` for a different reason: ruff formats Python inside fenced markdown
# blocks, and a fenced block in this repository is documentation. The examples in
# `specs/` align their trailing comments into columns on purpose and are
# transcribed into tests by hand; the playground's blocks are *fragments* --
# a few lines lifted out of a function to be talked about.
#
# Formatting them does not merely cost readability, it can change what they say.
# `ruff format .` rewrote a snippet in playground 11 from a keyword argument
# into a one-tuple assignment:
#
#     media_type=reported_media_type(a, b),   ->   media_type = (
#                                                      reported_media_type(a, b),
#                                                  )
#
# which is valid Python meaning something else entirely, in a document teaching
# someone what the line does. `specs` stays listed because it is excluded from
# linting as well, not only formatting.
extend-exclude = ["tests/fixtures/documents/postmortems", "specs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
