# A folder of PDFs, wanted two ways.
#
# `convert:` is the *kind* half of the pair a converter is registered against
# (R8.3). Omitting it would mean the default kind for whatever media type each
# document turns out to be -- `markdown`, which is the normal case for a folder of
# notes. Naming both kinds asks for two artifacts per document, from two
# converters, under two keys.
#
# An empty list is refused rather than read as "convert to nothing": absent and
# empty are different declarations, and reading one as the other would give a
# source the opposite of what it asked for, silently (R3.9).
sources:
  - id: postmortems-pdf
    type: folder
    path: inbox/postmortems/
    convert: [markdown, page_images]
