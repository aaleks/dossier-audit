[project]
name = "dossier-pdf-playground"
version = "0.1.0"
description = "Playground converters: a PDF read as markdown, and its embedded images."
requires-python = ">=3.12"

# The point of the exercise. A PDF converter is a large dependency with its own
# release cadence, so it is a package a workspace installs -- never an edit to
# anything under `src/dossier/` (R8.7, and the reasoning in
# dossier/infrastructure/converters/registry.py).
dependencies = ["pypdf>=6.0"]

# How dossier finds a converter: the entry point group, and nothing else. There
# is no list inside dossier to add to, and no match statement to extend.
[project.entry-points."dossier.converters"]
pdf-markdown = "dossier_pdf_playground.markdown:PdfMarkdownConverter"
pdf-page-images = "dossier_pdf_playground.images:PdfPageImagesConverter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier_pdf_playground"]
