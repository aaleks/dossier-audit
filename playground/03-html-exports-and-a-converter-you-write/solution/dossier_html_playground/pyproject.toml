[project]
name = "dossier-html-playground"
version = "0.2.0"
description = "Playground converters: a wiki's HTML export without its breadcrumb, and a CSV register as a table."
requires-python = ">=3.12"

# Neither converter needs anything outside the standard library, which is
# deliberate: the entry-point mechanism is what makes a converter a package
# somebody installs rather than an edit to `dossier` (R8.7), and it costs nothing
# when the converter is small. `dossier`'s own `html-markdown` reads HTML with
# markdownify and BeautifulSoup, pinned exactly because what a library writes is
# inside the artifact. A converter built on the standard library pins nothing,
# and its version has to cover the interpreter instead.
dependencies = []

# How dossier finds a converter: the entry point group, and nothing else. There
# is no list inside dossier to add to, and no match statement to extend.
#
# Two entries, two pairs, one package -- and both pairs are ones `dossier`
# already answers. Each converter therefore has an id of its own, since two
# claims are told apart by id and version, and each is opt-in, so it answers only
# in a workspace whose sources.yaml names it (R8.13).
[project.entry-points."dossier.converters"]
play-html-markdown = "dossier_html_playground.html_export:HtmlMarkdownConverter"
play-csv-table = "dossier_html_playground.csv_table:CsvTableConverter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier_html_playground"]
