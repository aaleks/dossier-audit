# Task 7's pipeline, for syncing and converting `atlassian-docs` on its own.
#
# `dossier sync` and `dossier convert` take a pipeline and act on the sources it
# names, so a second source that is not to be audited with the KIPs needs a
# pipeline of its own. It is never run: the step is here because a pipeline
# must have one, and it borrows kip-audit's prompt and fields rather than
# copying them.
sources: [atlassian-docs]

model: openai:gpt-5.4-mini

steps:
  - id: extract
    prompt: ../kip-audit/prompts/01_extract.md
    input: documents
    mode: per_file
    output: ../kip-audit/schemas/kip.yaml
