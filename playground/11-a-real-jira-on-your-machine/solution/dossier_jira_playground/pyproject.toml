[project]
name = "dossier-jira-playground"
version = "0.2.0"
description = "A playground converter: a Jira issue read as markdown, labels included."
requires-python = ">=3.12"

# Nothing outside the standard library. A Jira issue is JSON, and `json` reads
# JSON -- the whole converter is one function deciding which fields of a large
# payload are the document and in what order they are written.
dependencies = []

# The same group exercise 03's package declares, and the same group `dossier`'s
# own converters declare (R8.7). There is no list inside `dossier` that this is
# added to. `dossier` already claims this converter's pair with
# `jira-issue-markdown`, so installing this one makes two claimants, and
# `dossier convert` refuses until `sources.yaml` names one under `converters:`
# (R8.13) -- which is task 8.
[project.entry-points."dossier.converters"]
play-jira-issue-markdown = "dossier_jira_playground.issue_markdown:JiraIssueMarkdownConverter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier_jira_playground"]
