# One step, asked once per contract rather than once per file (R3.15).
#
# `per_group` needs no other key: a document's group is its key up to the first
# `/`, so the subfolders in `inbox/contracts/` are the groups. Change the mode to
# `per_file` to see task 2's four calls again.
sources: [contracts]

model: openai:gpt-5.4-mini

steps:
  - id: extract
    prompt: prompts/01_extract.md
    input: documents
    mode: per_group
    output: schemas/contract.yaml
